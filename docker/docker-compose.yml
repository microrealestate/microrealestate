services:
  ###############################################################################
  # Init
  # Prepares the host directories bind-mounted into services running as uid 1000.
  ###############################################################################
  # Every bind mount below carries ':z' so SELinux (enforcing by default on the
  # RHEL family) lets containers reach them; ignored where SELinux is not in use.
  # ':z' (shared), not ':Z' (private): ../data/uploads is mounted by both init
  # and pdfgenerator, and ':Z' would relabel it for whichever started last.
  init:
    image: alpine:3
    user: root
    network_mode: none
    command: sh -c 'mkdir -p /mnt/uploads && chown -R 1000:1000 /mnt/uploads'
    volumes:
      - ../data/uploads:/mnt/uploads:z
  ###############################################################################
  # Redis
  ###############################################################################
  redis:
    image: redis:7.4-bookworm
    restart: unless-stopped
    mem_limit: 64m
    memswap_limit: 64m
    expose:
      - '6379'
    volumes:
      - ../data/redis:/data:z
    command:
      [
        'sh',
        '-c',
        'docker-entrypoint.sh --requirepass ${REDIS_PASSWORD:?REDIS_PASSWORD is required} --loglevel warning --maxmemory 32mb --maxmemory-policy allkeys-lru'
      ]
    networks:
      - net
  ###############################################################################
  # Mongo
  ###############################################################################
  mongo:
    image: mongo:7
    restart: unless-stopped
    mem_limit: 448m
    memswap_limit: 448m
    command: ["--bind_ip_all", "--quiet", "--logpath", "/dev/null", "--wiredTigerCacheSizeGB", "0.25"]
    expose:
      - '27017'
    volumes:
      - ../data/mongodb:/data/db:z
      - ../backup:/backup:z
    networks:
      - net
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
  ###############################################################################
  # Reverse Proxy
  ###############################################################################
  reverse-proxy:
    image: caddy:latest
    restart: unless-stopped
    mem_limit: 128m
    memswap_limit: 128m
    # --resume prefers the config the app pushed through the admin API (Caddy
    # autosaves it in caddy_config) over the bootstrap file, so a restart or a
    # recreate keeps the configured domain. The Caddyfile still applies first.
    command: caddy run --resume --config /etc/caddy/Caddyfile --adapter caddyfile
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro,z
      - caddy_data:/data
      - caddy_config:/config
    ports:
      - '${MRE_HTTP_PORT:-80}:80'
      - '${MRE_HTTPS_PORT:-443}:443'
    networks:
      - net
      - egress # the net network is internal, published ports need egress
  ###############################################################################
  # Gateway
  ###############################################################################
  gateway:
    restart: unless-stopped
    image: 'ghcr.io/microrealestate/microrealestate/gateway:${MRE_VERSION:-latest}'
    build:
      context: ..
      dockerfile: services/gateway/Dockerfile
    mem_limit: 384m
    memswap_limit: 384m
    environment:
      NODE_ENV: production
      NODE_OPTIONS: --max-old-space-size=128
      LOGGER_LEVEL: info
      PORT: 8080
      TRUST_PROXY: ${TRUST_PROXY:-uniquelocal}
      AUTHENTICATOR_URL: http://authenticator:8000
      API_URL: http://api:8200/api/v2
      PDFGENERATOR_URL: http://pdfgenerator:8300/pdfgenerator
      EMAILER_URL: http://emailer:8400/emailer
      TENANTAPI_URL: http://tenantapi:8250/tenantapi
      LANDLORD_FRONTEND_URL: http://landlord-frontend:8180
      TENANT_FRONTEND_URL: http://tenant-frontend:8190
    expose:
      - '8080'
    # healthcheck:
    #   test: >
    #     sh -c "
    #     wget --no-verbose --tries=1 --spider http://api:8200/health &&
    #     wget --no-verbose --tries=1 --spider http://authenticator:8000/health &&
    #     wget --no-verbose --tries=1 --spider http://emailer:8400/health &&
    #     wget --no-verbose --tries=1 --spider http://pdfgenerator:8300/health &&
    #     wget --no-verbose --tries=1 --spider http://tenantapi:8250/health &&
    #     wget --no-verbose --tries=1 --spider http://landlord-frontend:8180/health &&
    #     wget --no-verbose --tries=1 --spider http://tenant-frontend:8190/health
    #     "
    depends_on:
      authenticator:
        condition: service_started
      pdfgenerator:
        condition: service_started
      emailer:
        condition: service_started
      api:
        condition: service_started
      tenantapi:
        condition: service_started
    networks:
      - net
  ###############################################################################
  # Authenticator
  ###############################################################################
  authenticator:
    restart: unless-stopped
    image: 'ghcr.io/microrealestate/microrealestate/authenticator:${MRE_VERSION:-latest}'
    build:
      context: ..
      dockerfile: services/authenticator/Dockerfile
    mem_limit: 384m
    memswap_limit: 384m
    environment:
      NODE_ENV: production
      NODE_OPTIONS: --max-old-space-size=128
      LOGGER_LEVEL: info
      PORT: 8000
      TRUST_PROXY: ${TRUST_PROXY:-uniquelocal}
      REDIS_URL: redis://redis
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
      ACCESS_TOKEN_SECRET: ${ACCESS_TOKEN_SECRET:?ACCESS_TOKEN_SECRET is required}
      REFRESH_TOKEN_SECRET: ${REFRESH_TOKEN_SECRET:?REFRESH_TOKEN_SECRET is required}
      RESET_TOKEN_SECRET: ${RESET_TOKEN_SECRET:?RESET_TOKEN_SECRET is required}
      MONGO_URL: ${MONGO_URL:-mongodb://mongo:27017/mredb}
      EMAILER_URL: http://emailer:8400/emailer
    expose:
      - '8000'
    depends_on:
      redis:
        condition: service_started
      mongo:
        condition: service_healthy
      emailer:
        condition: service_started
    networks:
      - net
  ###############################################################################
  # PDFGenerator
  ###############################################################################
  pdfgenerator:
    restart: unless-stopped
    image: 'ghcr.io/microrealestate/microrealestate/pdfgenerator:${MRE_VERSION:-latest}'
    build:
      context: ..
      dockerfile: services/pdfgenerator/Dockerfile
    mem_limit: 768m
    memswap_limit: 896m
    environment:
      NODE_ENV: production
      NODE_OPTIONS: --max-old-space-size=192
      LOGGER_LEVEL: info
      PORT: 8300
      MONGO_URL: ${MONGO_URL:-mongodb://mongo:27017/mredb}
      ACCESS_TOKEN_SECRET: ${ACCESS_TOKEN_SECRET:?ACCESS_TOKEN_SECRET is required}
      CIPHER_KEY: ${CIPHER_KEY:?CIPHER_KEY is required}
      CIPHER_IV_KEY: ${CIPHER_IV_KEY:?CIPHER_IV_KEY is required}
    volumes:
      - ../data/uploads:/usr/app/services/pdfgenerator/uploads:z
    expose:
      - '8300'
    depends_on:
      init:
        condition: service_completed_successfully
      mongo:
        condition: service_healthy
    networks:
      - net
  ###############################################################################
  # Emailer
  ###############################################################################
  emailer:
    restart: unless-stopped
    image: 'ghcr.io/microrealestate/microrealestate/emailer:${MRE_VERSION:-latest}'
    build:
      context: ..
      dockerfile: services/emailer/Dockerfile
    mem_limit: 384m
    memswap_limit: 384m
    environment:
      NODE_ENV: production
      NODE_OPTIONS: --max-old-space-size=128
      LOGGER_LEVEL: info
      PORT: 8400
      MONGO_URL: ${MONGO_URL:-mongodb://mongo/mredb}
      ACCESS_TOKEN_SECRET: ${ACCESS_TOKEN_SECRET:-access_token_secret}
      CIPHER_KEY: ${CIPHER_KEY:-cipher_key}
      CIPHER_IV_KEY: ${CIPHER_IV_KEY:-cipher_iv_key}
      PDFGENERATOR_URL: http://pdfgenerator:8300/pdfgenerator
    expose:
      - '8400'
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      mongo:
        condition: service_healthy
      pdfgenerator:
        condition: service_started
    networks:
      - net
      - egress # for SMTP
  ###############################################################################
  # api
  ###############################################################################
  api:
    restart: unless-stopped
    image: 'ghcr.io/microrealestate/microrealestate/api:${MRE_VERSION:-latest}'
    build:
      context: ..
      dockerfile: services/api/Dockerfile
    mem_limit: 448m
    memswap_limit: 448m
    environment:
      NODE_ENV: production
      NODE_OPTIONS: --max-old-space-size=192
      LOGGER_LEVEL: info
      PORT: 8200
      MONGO_URL: ${MONGO_URL:-mongodb://mongo:27017/mredb}
      EMAILER_URL: http://emailer:8400/emailer
      PDFGENERATOR_URL: http://pdfgenerator:8300/pdfgenerator
      ACCESS_TOKEN_SECRET: ${ACCESS_TOKEN_SECRET:-access_token_secret}
      CIPHER_KEY: ${CIPHER_KEY:-cipher_key}
      CIPHER_IV_KEY: ${CIPHER_IV_KEY:-cipher_iv_key}
    expose:
      - '8200'
    depends_on:
      mongo:
        condition: service_healthy
      pdfgenerator:
        condition: service_started
      emailer:
        condition: service_started
    networks:
      - net
  ###############################################################################
  # tenant api
  ###############################################################################
  tenantapi:
    restart: unless-stopped
    image: 'ghcr.io/microrealestate/microrealestate/tenantapi:${MRE_VERSION:-latest}'
    build:
      context: ..
      dockerfile: services/tenantapi/Dockerfile
    mem_limit: 384m
    memswap_limit: 384m
    environment:
      NODE_ENV: production
      NODE_OPTIONS: --max-old-space-size=128
      LOGGER_LEVEL: info
      PORT: 8250
      MONGO_URL: ${MONGO_URL:-mongodb://mongo:27017/mredb}
      ACCESS_TOKEN_SECRET: ${ACCESS_TOKEN_SECRET:?ACCESS_TOKEN_SECRET is required}
      CIPHER_KEY: ${CIPHER_KEY:?CIPHER_KEY is required}
      CIPHER_IV_KEY: ${CIPHER_IV_KEY:?CIPHER_IV_KEY is required}
    expose:
      - '8250'
    depends_on:
      mongo:
        condition: service_healthy
    networks:
      - net
  ###############################################################################
  # Landlord frontend
  ###############################################################################
  landlord-frontend:
    restart: unless-stopped
    image: 'ghcr.io/microrealestate/microrealestate/landlord-frontend:${MRE_VERSION:-latest}'
    build:
      context: ..
      dockerfile: webapps/landlord/Dockerfile
    mem_limit: 192m
    memswap_limit: 192m
    environment:
      NODE_ENV: production
      NODE_OPTIONS: --max-old-space-size=160
      PORT: 8180
      # Server-side only: used by the Next.js middleware to reach the gateway
      # from inside the container. Never exposed to the browser (apiClient
      # uses same-origin /api/v2/...).
      GATEWAY_URL: http://gateway:8080
      MRE_VERSION: ${MRE_VERSION:-}
    expose:
      - '8180'
    depends_on:
      gateway:
        condition: service_started
    networks:
      - net
  ##############################################################################
  # Tenant frontend
  ###############################################################################
  tenant-frontend:
    restart: unless-stopped
    image: 'ghcr.io/microrealestate/microrealestate/tenant-frontend:${MRE_VERSION:-latest}'
    build:
      context: ..
      dockerfile: webapps/tenant/Dockerfile
    mem_limit: 192m
    memswap_limit: 192m
    environment:
      NODE_ENV: production
      NODE_OPTIONS: --max-old-space-size=160
      PORT: 8190
      # Server-side only: used by the Next.js middleware to reach the gateway
      # from inside the container. Never exposed to the browser.
      GATEWAY_URL: http://gateway:8080
      MRE_VERSION: ${MRE_VERSION:-}
    expose:
      - '8190'
    depends_on:
      gateway:
        condition: service_started
    networks:
      - net
###############################################################################
# microservices network
###############################################################################
networks:
  # Not external network access
  net:
    driver: bridge
    internal: true
  # Ordinary bridge with external network access
  egress:
    driver: bridge
###############################################################################
# volumes
###############################################################################
volumes:
  caddy_data:
  caddy_config:
