name: Continuous Integration

on:
  push:
    branches:
      - main
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  IMAGE_PREFIX: ghcr.io/microrealestate/microrealestate

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '25'

      - name: Enable Corepack
        run: corepack enable

      - name: Locate the Yarn cache
        id: yarn-cache
        run: echo "dir=$(yarn config get cacheFolder)" >> "$GITHUB_OUTPUT"

      - name: Restore the Yarn cache
        uses: actions/cache@v4
        with:
          path: ${{ steps.yarn-cache.outputs.dir }}
          key: yarn-${{ runner.os }}-${{ hashFiles('yarn.lock') }}
          restore-keys: yarn-${{ runner.os }}-

      - name: Install dependencies
        run: yarn

      - name: Lint
        run: yarn lint

      - name: Validate generated Dockerfiles
        run: yarn validate:dockerfiles

      - name: Validate compose files
        run: |
          docker compose -f docker/docker-compose.yml \
            --env-file .env.ci config -q
          docker compose -f docker/docker-compose.yml -f docker/docker-compose.ci.yml \
            --env-file .env.ci config -q

  tsc:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: lint
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '25'

      - name: Enable Corepack
        run: corepack enable

      - name: Locate the Yarn cache
        id: yarn-cache
        run: echo "dir=$(yarn config get cacheFolder)" >> "$GITHUB_OUTPUT"

      - name: Restore the Yarn cache
        uses: actions/cache@v4
        with:
          path: ${{ steps.yarn-cache.outputs.dir }}
          key: yarn-${{ runner.os }}-${{ hashFiles('yarn.lock') }}
          restore-keys: yarn-${{ runner.os }}-

      - name: Install dependencies
        run: yarn

      - name: Type-check
        run: yarn tsc

  build-images:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: tsc
    strategy:
      fail-fast: false
      matrix:
        include:
          - appname: gateway
            dockerfile: services/gateway/Dockerfile
          - appname: api
            dockerfile: services/api/Dockerfile
          - appname: tenantapi
            dockerfile: services/tenantapi/Dockerfile
          - appname: authenticator
            dockerfile: services/authenticator/Dockerfile
          - appname: pdfgenerator
            dockerfile: services/pdfgenerator/Dockerfile
          - appname: emailer
            dockerfile: services/emailer/Dockerfile
          - appname: landlord-frontend
            dockerfile: webapps/landlord/Dockerfile
          - appname: tenant-frontend
            dockerfile: webapps/tenant/Dockerfile

    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-tags: true

      - name: Define image variables
        run: echo "SHORT_SHA=${GITHUB_SHA::7}" >> "$GITHUB_ENV"

      - name: Generate version.json
        run: node scripts/generate-version.mjs

      - name: Login to GitHub Container Registry
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ secrets.GHCR_USERNAME }}
          password: ${{ secrets.GHCR_TOKEN }}

      - name: Build ${{ matrix.appname }} image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: ${{ github.event_name == 'push' }}
          tags: ${{ env.IMAGE_PREFIX }}/${{ matrix.appname }}:sha-${{ env.SHORT_SHA }}
          cache-from: type=gha,scope=${{ matrix.appname }}
          cache-to: ${{ github.event_name == 'push' && format('type=gha,mode=max,scope={0}', matrix.appname) || '' }}
